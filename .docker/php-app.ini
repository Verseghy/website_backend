; Application PHP settings for the Verseghy backend.
;
; These are FUNCTIONAL requirements, not PHP2Shell mitigations. The PHP2Shell
; fix (CVE-2026-109618 / CVE-2026-109619) is the patched engine in the base
; image; this file does not touch session.upload_progress or memory_limit.
;
; The Backpack admin uploads post, author and colleague images. The engine
; defaults (upload_max_filesize 2M, post_max_size 8M) would reject them, so we
; restore the 40M limit the application previously configured on its nginx
; front end. post_max_size is kept just above upload_max_filesize so a
; max-size file plus its form fields still fit in one request.
upload_max_filesize = 40M
post_max_size = 41M
