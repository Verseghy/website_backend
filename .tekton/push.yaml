# Pipelines-as-Code: on push to master, run this PipelineRun in the verseghy
# namespace to build the image via a Shipwright BuildRun.
#
# The image must be tagged with the commit SHA ({{ revision }}): argocd-image-updater
# only deploys tags matching ^[0-9a-f]{40}$, so an untagged (:latest) build never
# ships.
#
# Uses the buildah-ubi9 BuildStrategy because the cluster buildah strategy needs
# x86-64-v3 CPUs the nodes lack
# (website_k8s/verseghy-website/builds/buildstrategy-buildah-ubi9.yaml).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-backend
  annotations:
    pipelinesascode.tekton.dev/on-event: '[push]'
    pipelinesascode.tekton.dev/on-target-branch: '[master]'
    pipelinesascode.tekton.dev/max-keep-runs: '5'
spec:
  timeouts:
    pipeline: '1h30m0s'
  taskRunTemplate:
    # This SA can create/get BuildRuns in verseghy via ClusterRole/edit.
    serviceAccountName: pipeline
  pipelineSpec:
    tasks:
      - name: trigger-shipwright-build
        timeout: '1h20m0s'
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: openshift-client
            - name: namespace
              value: openshift-pipelines
        params:
          - name: SCRIPT
            value: |
              BR=$(echo '{"apiVersion":"shipwright.io/v1beta1","kind":"BuildRun","metadata":{"generateName":"backend-pac-","labels":{"pipelinesascode.tekton.dev/sha":"{{ revision }}","app.kubernetes.io/managed-by":"pipelines-as-code"}},"spec":{"build":{"spec":{"source":{"type":"Git","git":{"url":"https://github.com/Verseghy/website_backend","revision":"{{ revision }}"}},"strategy":{"name":"buildah-ubi9","kind":"BuildStrategy","stepResources":[{"name":"build-and-push","resources":{"requests":{"cpu":"1","memory":"2Gi"},"limits":{"cpu":"2","memory":"4Gi"}}}]},"paramValues":[{"name":"dockerfile","value":"Dockerfile"}],"output":{"image":"ghcr.io/verseghy/website_backend:{{ revision }}","pushSecret":"ghcr-pull-secret"},"timeout":"1h0m0s"}}}}' | oc create -o name -f -)
              echo "==> Created $BR (revision {{ revision }})"
              oc wait --for=jsonpath='{.status.completionTime}' "$BR" --timeout=75m
              succeeded=$(oc get "$BR" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}')
              echo "==> Succeeded=$succeeded"
              [ "$succeeded" = True ] || { oc get "$BR" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].message}{"\n"}'; exit 1; }
